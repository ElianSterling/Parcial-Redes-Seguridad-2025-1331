<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="670" viewBox="0 0 1600 670" role="img" aria-label="Portada del Segundo Parcial de Seguridad de Redes, Elian Sterling Severino Mejía, 2025-1331">
<defs>
