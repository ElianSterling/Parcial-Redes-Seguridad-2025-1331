  .cap{font-size:19px;fill:#c6dbe5}
  .devtitle{font-size:21px;font-weight:750;fill:#f0fbff}
  .devsub{font-size:15px;fill:#91b8ce}
  .tag{font-size:15px;letter-spacing:1.4px;fill:#a5c5d9}
  ]]></style>
