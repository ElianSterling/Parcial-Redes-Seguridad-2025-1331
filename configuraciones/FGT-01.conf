# FGT-01 - extracto literal de las secciones relevantes de la configuración FortiOS 7.0.3.
# Fuente: respaldo original exportado desde la GUI del FortiGate.
# No incluye el catálogo de servicios, certificados, llaves privadas ni configuraciones predeterminadas ajenas al laboratorio.
# Valores sensibles sustituidos por <REDACTED>. No utilizar como respaldo restaurable.
config system global
    set alias "FortiGate-VM64-KVM"
    set hostname "FGT-01"
    set timezone 04
end
config system interface
    edit "port1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping ssh http
        set type physical
        set snmp-index 1
    next
    edit "naf.root"
        set vdom "root"
        set type tunnel
        set src-check disable
        set snmp-index 2
    next
    edit "l2t.root"
        set vdom "root"
        set type tunnel
        set snmp-index 3
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
        set alias "SSL VPN interface"
        set snmp-index 4
    next
    edit "fortilink"
        set vdom "root"
        set fortilink enable
        set ip 10.255.1.1 255.255.255.0
        set allowaccess ping fabric
        set type aggregate
        set lldp-reception enable
        set lldp-transmission enable
        set snmp-index 5
    next
    edit "port2"
        set vdom "root"
        set ip 172.31.13.2 255.255.255.252
        set allowaccess ping
        set type physical
        set alias "WAN-CISCO"
        set lldp-reception enable
        set role wan
        set snmp-index 6
        config ipv6
            set ip6-send-adv enable
            set ip6-other-flag enable
        end
    next
    edit "port3"
        set vdom "root"
        set ip 10.25.14.1 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "LAN-REMOTA"
        set device-identification enable
        set lldp-transmission enable
        set role lan
        set snmp-index 7
        config ipv6
            set ip6-send-adv enable
            set ip6-other-flag enable
        end
    next
    edit "VPN-R1-ITLA"
        set vdom "root"
        set type tunnel
        set snmp-index 8
        set interface "port2"
    next
end
config firewall address
    edit "Origen"
        set uuid 0765fbac-dd1a-51f1-d36f-b3a7794e6579
        set subnet 10.25.14.0 255.255.255.0
    next
    edit "Destino"
        set uuid 0efc3822-dd1a-51f1-d51c-d35a24400380
        set subnet 10.25.13.0 255.255.255.0
    next
end
config vpn ipsec phase1-interface
    edit "VPN-R1-ITLA"
        set interface "port2"
        set peertype any
        set net-device disable
        set proposal des-sha1
        set dhgrp 2
        set nattraversal disable
        set remote-gw 172.31.13.1
        set psksecret <REDACTED>
    next
end
config vpn ipsec phase2-interface
    edit "VPN-R1-ITLA-P2"
        set phase1name "VPN-R1-ITLA"
        set proposal des-sha1
        set pfs disable
        set src-subnet 10.25.14.0 255.255.255.0
        set dst-subnet 10.25.13.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "LAN-TO-VPN"
        set uuid 32b5b9e6-dd1a-51f1-a3f9-f7f083d69757
        set srcintf "port3"
        set dstintf "VPN-R1-ITLA"
        set action accept
        set srcaddr "Origen"
        set dstaddr "Destino"
        set schedule "always"
        set service "PING"
    next
    edit 2
        set name "VPN-TO-LAN"
        set uuid 4a1b22ce-dd1a-51f1-cc88-1768ea823429
        set srcintf "VPN-R1-ITLA"
        set dstintf "port3"
        set action accept
        set srcaddr "Destino"
        set dstaddr "Origen"
        set schedule "always"
        set service "PING"
    next
end
config router static
    edit 1
        set dst 10.25.13.0 255.255.255.0
        set device "VPN-R1-ITLA"
    next
end
